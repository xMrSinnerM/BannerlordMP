; BannerlordMP settings. Host and clients read their own copy; the host's time settings win.

; Name shown to the other players.
PlayerName=Player

; Server defaults (the main menu "Host Co-op Campaign" lets you change them each time).
ServerName=Calradia Co-op
; Leave empty for no password.
ServerPassword=
; How many player heroes the server allows.
MaxSlots=4
; Off, InviteOnly, FriendsOnly or Public. Needs the Steam version of the game.
SteamVisibility=FriendsOnly

; UDP port the host listens on (forward it on your router for internet play).
Port=7777

; Run this game as a dedicated world host (same as the mp.server command): nobody plays on this machine,
; its own hero is parked, and the world never pauses for the host's battles. Every player joins as a client.
DedicatedHost=false

; Shared time control. LastRequestWins: anyone can pause/play/fast-forward for everyone.
; Consensus: the world runs at the slowest speed any player on the map asked for.
TimeArbitration=LastRequestWins

; If true, map conversations work like battles: the world keeps running and you are fast-forwarded afterwards.
DetachDuringConversations=true

; How many times per real second the host sends party positions.
SnapshotRateHz=4

; Fast-forward multiplier used to catch a player up after a battle (the game's own fast-forward is 4).
CatchUpMultiplier=16

; Campaign hours a client may fall behind before it fast-forwards to catch up.
CatchUpThresholdHours=0.5
